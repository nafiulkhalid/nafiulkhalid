<svg xmlns="http://www.w3.org/2000/svg" width="848" height="206" viewBox="0 0 848 206" role="img" aria-label="Transformer LLM (flagship): GPT-style transformer written from scratch (tokenizer, attention, training loop), served through a streaming FastAPI + React chat UI.">
  <style>
    .sans { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow .7s ease-out backwards; }
    @keyframes grow { from { transform: scaleX(0); } }
  </style>
  <rect x="4.5" y="0.5" width="839" height="205" rx="10" fill="#161b22" stroke="#30363d"/>
  <text class="sans" x="28" y="40" font-size="11" font-weight="600" letter-spacing="0.8" fill="#79b8ff">LLM &amp; ML · FLAGSHIP</text>
  <text class="sans" x="28" y="72" font-size="22" font-weight="700" fill="#e6edf3">Transformer LLM</text>
  <text class="sans" x="28" y="100" font-size="14" fill="#c9d1d9">GPT-style transformer written from scratch (tokenizer,</text>
  <text class="sans" x="28" y="121" font-size="14" fill="#c9d1d9">attention, training loop), served through a streaming FastAPI</text>
  <text class="sans" x="28" y="142" font-size="14" fill="#c9d1d9">+ React chat UI.</text>
  <rect x="28" y="160" width="66.4" height="22" rx="6" fill="#21262d"/>
  <text class="mono" x="36" y="175" font-size="12" fill="#c9d1d9" textLength="50.4" lengthAdjust="spacing">PyTorch</text>
  <rect x="100.4" y="160" width="66.4" height="22" rx="6" fill="#21262d"/>
  <text class="mono" x="108.4" y="175" font-size="12" fill="#c9d1d9" textLength="50.4" lengthAdjust="spacing">FastAPI</text>
  <rect x="172.8" y="160" width="52" height="22" rx="6" fill="#21262d"/>
  <text class="mono" x="180.8" y="175" font-size="12" fill="#c9d1d9" textLength="36" lengthAdjust="spacing">React</text>
  <line x1="498.5" y1="24" x2="498.5" y2="182" stroke="#30363d"/>
  <text class="mono" x="522" y="80" font-size="40" font-weight="700" fill="#4493f8">[n]<tspan font-size="16" font-weight="400" fill="#8b949e"> tok/s</tspan></text>
  <text class="sans" x="522" y="104" font-size="12" fill="#8b949e">Throughput on [hardware]</text>
  <text class="sans" x="522" y="139" font-size="12" fill="#c9d1d9">baseline</text>
  <rect class="bar" style="animation-delay:0.20s" x="606" y="130" width="70" height="10" rx="3" fill="#484f58"/>
  <text class="sans" x="522" y="161" font-size="12" fill="#c9d1d9">+ [opt. 1]</text>
  <rect class="bar" style="animation-delay:0.45s" x="606" y="152" width="120" height="10" rx="3" fill="#4493f8"/>
  <text class="sans" x="522" y="183" font-size="12" fill="#c9d1d9">+ [opt. 2]</text>
  <rect class="bar" style="animation-delay:0.70s" x="606" y="174" width="160" height="10" rx="3" fill="#4493f8"/>
</svg>