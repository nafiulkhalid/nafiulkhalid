<text x="44" y="148" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#8b949e" letter-spacing="0.6">WHY NAFI FITS</text>
<text x="44" y="176" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#4493f8">▸</text>
<text x="64" y="176" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Built five systems from scratch: database, search engine, HTTP server,</text>
<text x="64" y="200" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">regex engine and a GPT-style LLM.</text>
<text x="44" y="224" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#4493f8">▸</text>
<text x="64" y="224" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Knows what sits under the frameworks, from wire protocols to attention.</text>
<text x="44" y="248" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#4493f8">▸</text>
<text x="64" y="248" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">Researches how people trust LLM output, so he builds for real users.</text>
